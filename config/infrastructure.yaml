# Production topology for the Serega Stack Monitor.
# Keep private addresses, credentials, and tokens out of this public repository.

version: 1

dashboard:
  defaultNodeId: vm26830
  pollIntervalSeconds: 60

nodes:
  - id: seregapi
    name: seregapi
    subtitle: Raspberry Pi 5 · local workspace and service host
    address: Local host
    location: Home network
    status: healthy
    layer: physical
    hardware:
      kind: single-board-computer
      model: Raspberry Pi 5 Model B Rev 1.0
      cpu: Broadcom BCM2712
      memory: 8 GB
      storage: Root disk monitored by local probe
      architecture: aarch64
      os: Linux
    metrics:
      cpu: null
      memory: null
      disk: null
      uptime: "—"

  - id: marketpi
    name: marketpi
    subtitle: Raspberry Pi for marketplace automation
    address: Tailscale private network
    location: Home network
    status: healthy
    layer: tailscale
    hardware:
      kind: single-board-computer
      model: Raspberry Pi for marketplace automation
      cpu: ARM single-board computer
      memory: 8 GB
      storage: Root disk monitored by SSH probe
      architecture: aarch64
      os: Linux
    metrics:
      cpu: null
      memory: null
      disk: null
      uptime: "—"

  - id: vm26830
    name: vm26830
    subtitle: VPS reverse proxy for serega.me
    address: 94.159.98.135
    location: Amsterdam
    status: healthy
    layer: edge
    hardware:
      kind: vps
      model: VPS reverse proxy
      cpu: Virtual CPU
      memory: 1 GB
      storage: Root disk monitored by SSH probe
      architecture: x86_64
      os: Linux
    metrics:
      cpu: null
      memory: null
      disk: null
      uptime: "—"

projects:
  - id: maple-local
    name: Maple local
    nodeId: seregapi
    endpoint: Local health check
    status: healthy
    latencyMs: null
    description: Expected HTTP 200 from the local Maple health endpoint

  - id: maple-public-proxy
    name: Maple public proxy
    nodeId: seregapi
    endpoint: Local proxy health check
    status: offline
    latencyMs: null
    description: Expected HTTP 200 from the Maple public-proxy health endpoint

  - id: marketpi-openclaw
    name: marketpi OpenClaw Gateway
    nodeId: marketpi
    endpoint: Tailscale service
    status: healthy
    latencyMs: null
    description: Expected HTTP 200 or 401 from the OpenClaw gateway

  - id: dashboard-local
    name: Dashboard local API
    nodeId: seregapi
    endpoint: Process self-check
    status: healthy
    latencyMs: null
    description: Confirms that the dashboard API process is running

  - id: serega-me
    name: serega.me
    nodeId: vm26830
    endpoint: https://serega.me
    status: healthy
    latencyMs: null
    description: Expected HTTP 200 from the public endpoint

  - id: maple
    name: maple.serega.me
    nodeId: vm26830
    endpoint: https://maple.serega.me
    status: healthy
    latencyMs: null
    description: Expected HTTP 401 or 200 from the public endpoint

  - id: dashboard
    name: dashboard.serega.me
    nodeId: vm26830
    endpoint: https://dashboard.serega.me
    status: healthy
    latencyMs: null
    description: Expected HTTP 401 or 200 from the protected public endpoint
